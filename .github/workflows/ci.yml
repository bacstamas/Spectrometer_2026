name: ci 
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Opt into Node 24 as requested by the warning
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      # Update to v4 of upload-artifact if you use it, 
      # but standard MkDocs deploy usually just needs this:
      - run: pip install mkdocs-material
      - run: mkdocs gh-deploy --force